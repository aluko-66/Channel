<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Velora — Cart & Product Debug Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; background: #0d1117; color: #c9d1d9; padding: 2rem; }
    h1 { font-size: 1.4rem; margin-bottom: .5rem; color: #58a6ff; }
    p.sub { font-size: .8rem; color: #8b949e; margin-bottom: 1.5rem; }
    .group { margin-bottom: 1rem; }
    .group h2 { font-size: .85rem; color: #8b949e; text-transform: uppercase; letter-spacing: .08em; margin-bottom: .4rem; }
    button { background: #161b22; color: #58a6ff; border: 1px solid #30363d; padding: .4rem .85rem; cursor: pointer; font-family: monospace; font-size: .82rem; margin-right: .4rem; margin-bottom: .4rem; border-radius: 4px; }
    button:hover { border-color: #58a6ff; background: #1f2937; }
    button.danger { color: #f85149; border-color: #30363d; }
    button.danger:hover { border-color: #f85149; }
    #output { margin-top: 1.5rem; background: #161b22; border: 1px solid #30363d; padding: 1rem; white-space: pre-wrap; font-size: .82rem; min-height: 220px; border-radius: 6px; }
    .label { color: #8b949e; font-size: .75rem; margin-bottom: .3rem; }
    .err { color: #f85149; }
  </style>
</head>
<body>
  <h1>🛒 Velora Cart Debug Dashboard</h1>
  <p class="sub">Use the buttons below to hit the API and observe buggy behaviour.</p>

  <div class="group">
    <h2>Products</h2>
    <button onclick="call('/api/products')">GET /api/products (all)</button>
    <button onclick="call('/api/products/search?name=mouse')">Search "mouse" (should match)</button>
    <button onclick="call('/api/products/search?name=Ergonomic Mouse')">Search exact name (works)</button>
    <button onclick="call('/api/products/search?name=lamp')">Search "lamp" (should match)</button>
  </div>

  <div class="group">
    <h2>Cart</h2>
    <button onclick="addToCart(1,1,2)">Add product 1 × 2 → user 1</button>
    <button onclick="addToCart(1,1,1)">Add product 1 × 1 again → user 1 (watch qty)</button>
    <button onclick="call('/api/cart/1')">GET cart for user 1</button>
    <button class="danger" onclick="removeFromCart(1,1)">DELETE product 1 from user 1</button>
  </div>

  <div id="output">Click a button to call the API…</div>

  <script>
    const out = document.getElementById("output");

    async function call(url, opts) {
      out.className = "";
      out.textContent = `→ ${opts?.method || "GET"} ${url}\n\n`;
      try {
        const res = await fetch(url, opts);
        const data = await res.json();
        if (!res.ok) out.className = "err";
        out.textContent += JSON.stringify(data, null, 2);
      } catch (e) {
        out.className = "err";
        out.textContent += "Network error: " + e.message;
      }
    }

    function addToCart(user_id, product_id, quantity) {
      call("/api/cart", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id, product_id, quantity })
      });
    }

    function removeFromCart(user_id, product_id) {
      call(`/api/cart/${user_id}/${product_id}`, { method: "DELETE" });
    }
  </script>
</body>
</html>
